name: SignalForge Lead Scan

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalforge-lead-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore deduplication state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: signalforge-state-${{ github.run_id }}
          restore-keys: signalforge-state-
      - name: Scan and deliver leads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          MIN_LEAD_SCORE: ${{ vars.MIN_LEAD_SCORE }}
          MAX_POST_AGE_HOURS: ${{ vars.MAX_POST_AGE_HOURS }}
          SUBREDDITS: ${{ vars.SUBREDDITS }}
          SEARCH_TERMS: ${{ vars.SEARCH_TERMS }}
        run: python money_engine.py
      - name: Save deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: signalforge-state-${{ github.run_id }}
