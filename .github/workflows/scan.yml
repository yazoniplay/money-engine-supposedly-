name: SignalForge Lead Scan

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalforge-lead-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore deduplication state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: signalforge-state-${{ github.run_id }}
          restore-keys: signalforge-state-
      - name: Scan and deliver leads
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          MIN_LEAD_SCORE: ${{ vars.MIN_LEAD_SCORE }}
          MAX_POST_AGE_HOURS: ${{ vars.MAX_POST_AGE_HOURS }}
          SUBREDDITS: ${{ vars.SUBREDDITS }}
          SEARCH_TERMS: ${{ vars.SEARCH_TERMS }}
        run: python money_engine.py
      - name: Save deduplication state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: signalforge-state-${{ github.run_id }}
